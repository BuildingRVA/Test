name: Update North Anna River readings

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: north-anna-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official USGS observations
        run: python scripts/update_data.py
      - name: Publish snapshot for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add north-anna-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh USGS river readings"
            git push
          fi
