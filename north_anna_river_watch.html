function gaugeRow(site,i){const st=statusFor(site);const q=miniReading(site,'00060'),h=miniReading(site,'00065');return `<button class="gauge-row ${site.archive?'archived':''}" type="button" onclick="openSite('${site.id}')"><div class="gauge-row-main"><div class="gauge-number">${String(i+1).padStart(2,'0')}</div><div class="gauge-label">${esc(site.short)}<div class="gauge-desc">USGS ${esc(site.id)} &nbsp;·&nbsp; <span class="tag ${st.cls}">${esc(st.text)}</span></div></div><span class="row-chevron">›</span></div><div class="gauge-readings"><span><em>FLOW &nbsp;</em> ${fmtReading(q)}</span><span><em>STAGE &nbsp;</em> ${fmtReading(h)}</span></div></button>`}
function goHome(target='map'){app.view=target;app.page='home';app.detail=null;app.chartToken++;history.replaceState(null,'','#home');render();navActive(target==='stations'?'stations':'map');if(target==='stations')setTimeout(()=>document.getElementById('stations-anchor')?.scrollIntoView({behavior:'smooth',block:'start'}),90);else window.scrollTo(0,0)}
function showAbout(){app.page='about';app.detail=null;app.chartToken++;history.replaceState(null,'','#about');navActive('about');render();window.scrollTo(0,0)}
function toggleArchived(){app.archived=!app.archived;render();if(!app.archived)toast('Showing monitored stations');else toast('Historical stations are also shown')}
function readingCard(site,code,label){const r=miniReading(site,code);const cls=!r?'empty':'';const stale=r?ageHours(r.time)>24:true;return `<div class="reading ${cls}"><div class="label">${label}</div><div class="metric"><span>${r?nice(r.value,code==='00060'?1:2):'—'}</span><small>${r?esc(unit(r.unit)):''}</small></div><div class="reading-age">${r?`Measured ${stamp(r.time)} ET${stale?' · older reading':''}`:site.requested?'No instantaneous reading available':'Fetching reading…'}</div></div>`}
function siteMarkup(site){const st=statusFor(site);const shown=selectedSites();const ix=shown.findIndex(s=>s.id===site.id);return `<div class="screen">
<div class="backline"><button class="back-btn" onclick="goHome('map')">${icon('back')} River map</button><div class="station-nav"><button type="button" aria-label="Previous gauge" onclick="adjacent(-1)" ${ix<=0?'disabled':''}>‹</button><button type="button" aria-label="Next gauge" onclick="adjacent(1)" ${ix>=shown.length-1?'disabled':''}>›</button></div></div>
<div class="station-hero"><div class="station-topline"><span class="tag ${st.cls}">● ${esc(st.text)}</span><span class="label">USGS ${esc(site.id)}</span></div><h1>${esc(site.short.replace(' · former station','').replace(' · former',''))}</h1><div class="station-location">${esc(site.name)}<br><a href="${SITE_URL(site.id)}" rel="noopener" target="_blank">Open official USGS station ↗</a></div></div>
<div class="detail-readings">${readingCard(site,'00060','Streamflow')}${readingCard(site,'00065','Gauge height')}</div>
<div class="panel" id="datapanel"><div class="panel-head"><div><h2>Measurements</h2><p>Select a data category and measurement to see actual readings.</p></div><button class="icon-btn" title="Reload this station" onclick="reloadSite('${site.id}')" aria-label="Reload station" style="min-width:36px;height:36px;border-radius:11px">${icon('refresh')}</button></div>
<div class="tabs" id="categorytabs">${[['continuous','Live sensors'],['daily','Daily'],['field','Field visits'],['peaks','Annual peaks']].map(([k,n])=>`<button type="button" class="pill ${app.tab===k?'selected':''}" onclick="changeTab('${k}')">${n}</button>`).join('')}</div>
<div id="measurements">${measurementMarkup(site)}</div></div>
<div class="panel"><div class="panel-head"><h2>Station details</h2><span class="label">USGS RECORD</span></div><div class="metadata-grid" style="margin-top:15px"><div class="metadata-item"><span class="label">Drainage area</span><strong>${Number.isFinite(site.drainage)?`${nice(site.drainage,1)} mi²`:'Not listed'}</strong></div><div class="metadata-item"><span class="label">Station ID</span><strong>${esc(site.id)}</strong></div><div class="metadata-item"><span class="label">Latitude</span><strong>${Number.isFinite(site.lat)?site.lat.toFixed(5):'—'}°</strong></div><div class="metadata-item"><span class="label">Longitude</span><strong>${Number.isFinite(site.lon)?site.lon.toFixed(5):'—'}°</strong></div></div><a class="underlink" target="_blank" rel="noopener" href="${SITE_URL(site.id)}">More site data, advisories and full records at USGS ↗</a></div>
<div class="footer-note">Data are requested directly from USGS when opened. “Historical gauge” does not mean a current reading is available. Gauge height is height relative to the gauge datum, not river depth. Check <a href="https://water.noaa.gov/" target="_blank" rel="noopener">NOAA Water Prediction</a> for official flood guidance.</div></div>`}
function adjacent(direction){const shown=selectedSites();const i=shown.findIndex(s=>s.id===app.detail);if(shown[i+direction])openSite(shown[i+direction].id)}
function openSite(id){const site=sites.find(s=>s.id===id);if(!site)return;app.page='detail';app.detail=id;app.tab='continuous';app.metricKey=null;app.period='7D';app.chart=[];app.chartToken++;history.replaceState(null,'','#gauge-'+id);navActive('stations');render();window.scrollTo(0,0);ensureSite(site)}
function changeTab(t){app.tab=t;app.metricKey=null;app.chart=[];app.period=(t==='daily'?'30D':t==='continuous'?'7D':'ALL');app.chartToken++;const site=currentSite();if(site){renderMeasurementArea(site);if(t==='field'||t==='peaks')loadExtras(site,t)}}
function currentSite(){return sites.find(s=>s.id===app.detail)}
function metricLabel(m){if(m.name&&m.name.toLowerCase()!==m.code.toLowerCase()){
 const base=LABELS[m.code]||m.name;return base+(m.stat&&m.stat!=='00011'&&m.cat==='daily'?` · ${({'00001':'max','00002':'min','00003':'mean','00008':'median'})[m.stat]||m.stat}`:'')}
 return (LABELS[m.code]||`Parameter ${m.code}`)+(m.stat&&m.stat!=='00011'&&m.cat==='daily'?` · ${({'00001':'max','00002':'min','00003':'mean','00008':'median'})[m.stat]||m.stat}`:'')
}
function getMetricKey(m){return `${m.cat}:${m.id||m.code+':'+(m.stat||'')}`}
function normalFeature(f,cat){const p=f.properties||f;const id=p.time_series_id||p.timeseries_id||p.field_measurements_series_id||'';return {id:String(id),cat,code:String(p.parameter_code||''),stat:String(p.statistic_id||''),value:Number(p.value),time:p.time||null,unit:p.unit_of_measure||'',qualifier:p.qualifier||null,raw:p,name:LABELS[p.parameter_code]||p.parameter_name||'',seriesEnd:p.time||''}}
function usable(m){return m.code&&Number.isFinite(m.value)&&epoch(m.time)>0}
function metricsFor(site,cat){if(cat==='field'||cat==='peaks'){return Object.values((site.extras[cat]||{}).groups||{}).map(g=>g.metric).sort(metricSort)}
const base=site.latest[cat]||[];const met=site.metadata.filter(m=>m.cat===cat);const map=new Map();for(let m of met)map.set(getMetricKey(m),m);for(let m of base){const key=getMetricKey(m);const prior=map.get(key)||{};map.set(key,{...prior,...m,name:prior.name||m.name,begin:prior.begin||m.begin,seriesEnd:prior.seriesEnd||m.time})}return [...map.values()].sort(metricSort)}
function metricSort(a,b){const seq={'00060':0,'00065':1,'00062':2,'00010':3};return (seq[a.code]??9)-(seq[b.code]??9)||metricLabel(a).localeCompare(metricLabel(b))}
function measurementMarkup(site){const cat=app.tab;const arr=metricsFor(site,cat);const error=site.errors[cat];if(!arr.length){if((cat==='field'||cat==='peaks')&&!site.extras[cat]&&!error)return `<div class="loading"><i class="spinner"></i>Loading ${cat==='field'?'field measurements':'annual peak values'}…</div>`;if(!site.requested&&!error)return `<div class="loading"><i class="spinner"></i>Finding available parameters…</div>`;if(error)return `<div class="errorbox">${esc(error)} <button class="text-button" onclick="${cat==='field'||cat==='peaks'?`loadExtras(currentSite(),'${cat}',true)`:`reloadSite('${site.id}')`}">Try again →</button></div>`;return `<div class="data-empty"><div class="big-icon">⌁</div>No ${cat==='continuous'?'automated':cat==='daily'?'daily':cat==='field'?'field':'annual peak'} observations were returned by USGS for this location.<br><a href="${SITE_URL(site.id)}" target="_blank" rel="noopener">Browse its original record →</a></div>`}
let selected=arr.find(m=>getMetricKey(m)===app.metricKey);if(!selected){selected=arr[0];app.metricKey=getMetricKey(selected)}
let current=Number.isFinite(selected.value)?selected: null;let freshness=epoch(selected.time)?`Reading: ${stamp(selected.time,'full')}`:(epoch(selected.seriesEnd)?`Last in series: ${stamp(selected.seriesEnd,'date')}`:'History available');
return `<div class="metricstrip" role="group" aria-label="Select a measurement">${arr.map(m=>`<button class="metricpill ${getMetricKey(m)===app.metricKey?'active':''}" onclick="chooseMetric('${esc(getMetricKey(m))}')" title="USGS parameter ${esc(m.code)}">${esc(metricLabel(m))}<span class="code">${esc(m.code)}${m.stat&&m.stat!=='00011'?` · ${esc(m.stat)}`:''}</span></button>`).join('')}</div>
<div class="metric-banner"><div><span class="label">${esc(metricLabel(selected))}</span><div style="font-size:10px;color:#91aeb5;margin-top:6px">${esc(freshness)}</div></div><div class="value-block"><strong>${current?nice(current.value):'—'}</strong><br><small>${esc(unit(selected.unit))} ${selected.cat==='peaks'?'· annual peak':''}</small></div></div>
${cat==='continuous'||cat==='daily'?`<div class="periods" role="group" aria-label="History range">${(cat==='daily'?[['7D','7 days'],['30D','30 days'],['90D','90 days'],['1Y','1 year'],['LAST','Last record']]:[['1D','24h'],['7D','7 days'],['30D','30 days'],['90D','90 days'],['LAST','Last record']]).map(([k,n])=>`<button class="period ${app.period===k?'active':''}" onclick="setPeriod('${k}')">${n}</button>`).join('')}</div>`:''}
<div class="chart" id="chart-area">${cat==='field'||cat==='peaks'?renderExtraChart(site,selected):`<div class="loading"><i class="spinner"></i>Fetching actual USGS observations…</div>`}</div>
<div class="record-notice">${cat==='continuous'?'Automated sensor readings':cat==='daily'?'Daily values (may be means, minima or maxima)':cat==='field'?'Individual field measurements':'Annual peak observations'} · Parameter ${esc(selected.code)}. ${selected.begin?`Record begins ${stamp(selected.begin,'date')}.`:''} ${selected.seriesEnd?`Last recorded ${stamp(selected.seriesEnd,'date')}.`:''}</div>
${cat==='continuous'||cat==='daily'?`<a class="underlink" href="${esc(collectionURL(cat,{monitoring_location_id:'USGS-'+site.id,parameter_code:selected.code}))}" target="_blank" rel="noopener">View raw readings directly at USGS ↗</a>`:''}`}
function renderMeasurementArea(site){if(app.page!=='detail'||app.detail!==site.id)return;const tabs=document.getElementById('categorytabs');if(tabs)tabs.querySelectorAll('.pill').forEach((b,i)=>b.classList.toggle('selected',['continuous','daily','field','peaks'][i]===app.tab));const el=document.getElementById('measurements');if(el){el.innerHTML=measurementMarkup(site);if(app.tab==='continuous'||app.tab==='daily')requestChart(site)}}
function chooseMetric(key){app.metricKey=key;app.chart=[];app.chartToken++;renderMeasurementArea(currentSite())}
function setPeriod(p){app.period=p;app.chart=[];app.chartToken++;renderMeasurementArea(currentSite())}
function render(){if(app.page==='home'){main.innerHTML=homeMarkup();createMap()}else if(app.page==='detail'){const s=currentSite();if(s){main.innerHTML=siteMarkup(s);if(app.tab==='continuous'||app.tab==='daily')requestChart(s)}else{goHome()}}else{main.innerHTML=aboutMarkup()}}
function createMap(){app.map=null;app.layers=[];const el=document.getElementById('river-map');if(!el)return;const points=selectedSites();if(typeof window.L!=='undefined'){
 try{let map=L.map(el,{zoomControl:false,scrollWheelZoom:false,tap:false}).setView([37.99,-77.73],10);app.map=map;
 L.tileLayer('https://{s}.basemaps.cartocdn.com/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);
 L.control.zoom({position:'topright'}).addTo(map);for(const s of points){if(!Number.isFinite(s.lat)||!Number.isFinite(s.lon))continue;
 let marker=L.marker([s.lat,s.lon],{icon:L.divIcon({className:'',html:`<div class="marker ${s.archive?'archived':''}" aria-label="${esc(s.short)}">${s.archive?'H':'●'}</div>`,iconSize:[35,35],iconAnchor:[17,17]})}).addTo(map);
 marker.on('click',()=>openSite(s.id));marker.bindTooltip(esc(s.short),{direction:'top',offset:[0,-16],opacity:.95});app.layers.push(marker)}
 const locs=points.filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lon)).map(s=>[s.lat,s.lon]);if(locs.length)map.fitBounds(L.latLngBounds(locs),{padding:[34,28],maxZoom:11});setTimeout(()=>{if(app.map===map)map.invalidateSize()},190);return
 }catch(e){console.warn('Leaflet map not available',e)}}
 // Graceful offline/CDN fallback: geographic station plot, not a fictional river trace.
 el.className='mapfallback';el.innerHTML='<div class="fallback-label">Geographic gauge positions · map tiles unavailable</div>';
 for(const s of points){const x=14+((s.lon+78.09)/.78)*72,y=12+((38.19-s.lat)/.45)*70;if(!Number.isFinite(x)||!Number.isFinite(y))continue;const b=document.createElement('button');b.className='fallbackpin';b.style.left=x+'%';b.style.top=y+'%';b.title=s.short;b.setAttribute('aria-label','Open '+s.short);b.innerHTML=`<span class="marker ${s.archive?'archived':''}">${s.archive?'H':'●'}</span>`;b.onclick=()=>openSite(s.id);el.appendChild(b)}
}
function aboutMarkup(){return `<div class="screen"><header class="top"><div class="brand"><div class="brand-icon">${icon('wave')}</div><div><div class="eyebrow">RIVER WATCH</div><div class="brand-title">North Anna</div></div></div><button class="icon-btn" onclick="goHome('map')">${icon('back')}</button></header><div class="about"><div class="eyebrow">THE DATA BEHIND THE MAP</div><h1>Made for the river.</h1><div class="info-card"><h3>What this app shows</h3><p>The North Anna River’s USGS gauging stations, live and last-reported streamflow, gauge height and other parameters when measured, plus daily averages, field readings and annual peaks where available.</p><p>Stations are ordered upstream to downstream using the USGS-reported drainage area when available. Historical stations can be displayed from the map page.</p></div><div class="info-card"><h3>Where readings come from</h3><p>All numbers are fetched directly from the <a href="https://api.waterdata.usgs.gov/" target="_blank" rel="noopener">USGS Water Data APIs</a>. No live readings are prefilled or simulated. Station discovery also uses USGS. Cartography © OpenStreetMap and CARTO.</p><p><a target="_blank" rel="noopener" href="https://api.waterdata.usgs.gov/docs/ogcapi/">USGS API documentation ↗</a></p></div><div class="info-card"><h3>Understanding the numbers</h3><p><strong>Streamflow (cfs)</strong> measures the volume of water passing a gauge per second. <strong>Gauge height (ft)</strong> is elevation above the gauge’s local reference point; it is not the water’s depth across the river.</p><p>Different gauges measure different parameters. An older reading is labeled rather than presented as current. Measurements may be provisional, delayed, adjusted or missing.</p></div><div class="info-card"><h3>Data coverage and safety</h3><p>This app catalogs USGS North Anna River gauges with automated or daily time series. It does not include private dam sensors, separate tributary and lake gauges, or the full laboratory water-quality sample archive. Historical, manual and peak readings appear when USGS makes them available.</p><p>For flooding and other urgent conditions consult <a href="https://water.noaa.gov/" rel="noopener" target="_blank">NOAA Water Prediction</a> and local official warnings. This is not a navigation or flood-warning system.</p></div><div class="info-card"><h3>Using it on iPhone</h3><p>Open this HTML in Safari from an HTTPS website (for example, GitHub Pages). Choose Share → Add to Home Screen. A web connection is needed for the map tiles and measurements. Local file previews in the Files app may block internet requests, so web hosting is recommended.</p></div></div></div>`}
/* --- Networking: USGS OGC API v1, v0 failover, and legacy IV backup --- */
async function fetchJSON(url,timeoutMs=18000){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),timeoutMs);try{const response=await fetch(url,{signal:ctrl.signal,headers:{Accept:'application/geo+json,application/json;q=0.9'}});if(!response.ok)throw Error(`HTTP ${response.status}`);const js=await response.json();if(!js||!Array.isArray(js.features))throw Error('Unexpected USGS response');app.networkOK=true;return js}finally{clearTimeout(timer)}}
function collectionURL(kind,params={},base=BASE){const u=new URL(`${base}/${kind}/items`);u.searchParams.set('f','json');for(const [k,v] of Object.entries(params))if(v!==null&&v!==undefined)u.searchParams.set(k,String(v));return u.toString()}
async function featurePage(kind,params={}){let err;for(const base of [BASE,BASE0]){try{return await fetchJSON(collectionURL(kind,params,base))}catch(e){err=e}}throw err}
async function features(kind,params={},maxPages=2){let result=[],url=collectionURL(kind,{limit:5000,...params}),page=0,limited=false;
 while(url&&page<maxPages){let js;try{js=page===0?await featurePage(kind,{limit:5000,...params}):await fetchJSON(url)}catch(e){if(page===0)throw e;limited=true;break}
 result.push(...js.features);page++;let next=(js.links||[]).find(l=>l.rel==='next'&&l.href);url=next?.href||'';
 if(page>=maxPages&&url)limited=true;if(result.length>20000){limited=true;break}}
 return {data:result,limited}
}
async function latestFor(site,cat){try{const json=await featurePage(cat==='continuous'?'latest-continuous':'latest-daily',{monitoring_location_id:'USGS-'+site.id,limit:1000});return json.features.map(f=>normalFeature(f,cat)).filter(usable)}catch(e){if(cat==='continuous'){try{return await legacyInstant(site.id)}catch{}}throw e}}
async function legacyInstant(id){const url=new URL('https://waterservices.usgs.gov/nwis/iv/');url.searchParams.set('format','json');url.searchParams.set('sites',id);url.searchParams.set('period','P7D');const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),17000);
 try{const res=await fetch(url,{signal:ctrl.signal});if(!res.ok)throw Error('Legacy data unavailable');const j=await res.json();app.networkOK=true;return (j.value?.timeSeries||[]).map(ts=>{let latest=ts.values?.flatMap(x=>x.value||[]).filter(v=>Number.isFinite(Number(v.value))).at(-1);const p=ts.variable||{};return latest?{id:String(ts.name||p.variableCode?.[0]?.value||''),cat:'continuous',code:p.variableCode?.[0]?.value||'',stat:'00011',value:Number(latest.value),time:latest.dateTime,unit:p.unit?.unitCode||'',name:p.variableName||'',qualifier:latest.qualifiers}:null}).filter(Boolean)}finally{clearTimeout(timer)}}
async function fetchMeta(site){const json=await featurePage('time-series-metadata',{monitoring_location_id:'USGS-'+site.id,limit:2000});return json.features.map(f=>{const p=f.properties||{};const stat=String(p.statistic_id||'');const period=String(p.computation_period_identifier||'').toLowerCase();const comp=String(p.computation_identifier||'').toLowerCase();const cat=period.includes('instant')||comp.includes('instant')||stat==='00011'?'continuous':'daily';return {id:String(p.id||f.id||''),cat,code:String(p.parameter_code||''),stat,value:NaN,time:null,unit:p.unit_of_measure||'',name:p.parameter_name||p.parameter_description||'',begin:p.begin_utc||p.begin||'',seriesEnd:p.end_utc||p.end||'',webDescription:p.web_description||''}}).filter(m=>m.code)}
async function ensureSite(site,force=false){if(site.requested&&!force)return;site.requested=true;site.errors.continuous='';site.errors.daily='';if(app.page==='detail'&&app.detail===site.id)render();const jobs=[['continuous',latestFor(site,'continuous')],['daily',latestFor(site,'daily')],['metadata',fetchMeta(site)]];
 await Promise.all(jobs.map(async([key,p])=>{try{const v=await p;if(key==='metadata')site.metadata=v;else site.latest[key]=v;delete site.errors[key]}catch(e){site.errors[key]=`Unable to connect to USGS ${key} data. ${e.message||''}`}
 if(app.page==='detail'&&app.detail===site.id){const scroll=window.scrollY;const c=document.getElementById('measurements');if(c){const s=document.querySelector('.station-hero .tag');if(s){let st=statusFor(site);s.textContent='● '+st.text;s.className='tag '+st.cls}document.querySelector('.detail-readings').innerHTML=readingCard(site,'00060','Streamflow')+readingCard(site,'00065','Gauge height');renderMeasurementArea(site)}else render();window.scrollTo(0,scroll)}else if(app.page==='home'){renderHomeSummaryOnly()}}
 ));app.dataError=!app.networkOK; if(app.page==='home')renderHomeSummaryOnly()}
function renderHomeSummaryOnly(){if(app.page!=='home')return;const y=window.scrollY;render();window.scrollTo(0,y)}
async function loadExtras(site,cat,force=false){if(!site)return;if(site.extras[cat]&&!force)return;if(site.extras[cat]&&force)delete site.extras[cat];site.errors[cat]='';if(app.tab===cat)renderMeasurementArea(site);
 try{const endpoint=cat==='field'?'field-measurements':'peaks';const r=await features(endpoint,{monitoring_location_id:'USGS-'+site.id},4);
 let groups={};for(const f of r.data){const m=normalFeature(f,cat);if(!usable(m))continue;const k=m.code+(cat==='field'?':'+String(m.raw.reading_type||''):'');if(!groups[k])groups[k]={metric:m,points:[]};groups[k].points.push(m);if(epoch(m.time)>epoch(groups[k].metric.time))groups[k].metric=m}
 for(const g of Object.values(groups))g.points.sort((a,b)=>epoch(a.time)-epoch(b.time));site.extras[cat]={groups,limited:r.limited};
 }catch(e){site.errors[cat]=`Could not retrieve ${cat==='field'?'field measurements':'annual peak records'} from USGS. ${e.message||''}`}
 if(app.page==='detail'&&app.detail===site.id&&app.tab===cat)renderMeasurementArea(site)
}
function renderExtraChart(site,selected){const cat=app.tab;const extra=site.extras[cat];const group=extra?.groups?.[selected.code+(cat==='field'?':'+String(selected.raw?.reading_type||''):'')];if(!group||!group.points.length)return `<div class="data-empty">No numeric observations for this parameter.</div>`;return chartSVG(group.points,selected,extra.limited,cat)}
async function requestChart(site){if(!site||app.page!=='detail'||app.detail!==site.id||!(app.tab==='continuous'||app.tab==='daily'))return;
 const cat=app.tab;const metric=metricsFor(site,cat).find(m=>getMetricKey(m)===app.metricKey);if(!metric)return;
 const token=++app.chartToken;const interval={'1D':'P1D','7D':'P7D','30D':'P30D','90D':'P90D','1Y':'P1Y'}[app.period];let datetime=interval;
 if(app.period==='LAST'){const end=metric.time||metric.seriesEnd;const endMs=epoch(end);if(endMs){const days=cat==='daily'?365:30;const startMs=endMs-days*86400000;datetime=new Date(startMs).toISOString()+'/'+new Date(endMs+86400000).toISOString()}else datetime='P30D'}
 const params={monitoring_location_id:'USGS-'+site.id,parameter_code:metric.code};if(metric.id&&!metric.id.includes(':')&&/^[a-z0-9-]{16,}$/i.test(metric.id))params.time_series_id=metric.id;else if(metric.stat)params.statistic_id=metric.stat;if(datetime)params.datetime=datetime;
 try{let r=await features(cat,params,cat==='continuous'?4:2);if(token!==app.chartToken||app.page!=='detail'||site.id!==app.detail)return;
 const points=r.data.map(f=>normalFeature(f,cat)).filter(m=>usable(m)&&m.code===metric.code&&(!metric.stat||!m.stat||m.stat===metric.stat)).sort((a,b)=>epoch(a.time)-epoch(b.time));app.chart=points;
 const el=document.getElementById('chart-area');if(!el)return;el.innerHTML=points.length?chartSVG(points,metric,r.limited,cat):`<div class="data-empty">No measurements returned for <strong>${app.period==='LAST'?'the last recorded window':esc(app.period)}</strong>.<br>${app.period!=='LAST'&&epoch(metric.seriesEnd)?`This series last reported ${stamp(metric.seriesEnd,'date')}.<br><button class="text-button" onclick="setPeriod('LAST')">Show last recorded data →</button>`:'Try another time range or consult USGS.'}</div>`;
 }catch(e){if(token!==app.chartToken)return;const el=document.getElementById('chart-area');if(el)el.innerHTML=`<div class="errorbox">Couldn't retrieve the chart readings from USGS. ${esc(e.message||'')} <button class="text-button" onclick="setPeriod('${app.period}')">Retry →</button></div>`}
}
function chartSVG(raw,metric,limited=false,cat='continuous'){
 // Display representative samples only for rendering speed; statistics use every fetched point.
 const valid=raw.filter(x=>Number.isFinite(x.value)&&epoch(x.time));if(!valid.length)return `<div class="data-empty">No numeric points available.</div>`;
 valid.sort((a,b)=>epoch(a.time)-epoch(b.time));const values=valid.map(x=>x.value);let lo=Math.min(...values),hi=Math.max(...values);if(!Number.isFinite(lo)||!Number.isFinite(hi))return '<div class="data-empty">No chart data available.</div>';
 const avg=values.reduce((s,x)=>s+x,0)/values.length;const pts=valid.length<=550?valid:Array.from({length:550},(_,i)=>valid[Math.round(i*(valid.length-1)/549)]);
 const w=355,h=222,l=38,r=10,t=14,b=30,plotW=w-l-r,plotH=h-t-b;let pad=(hi-lo)*.13||Math.max(.25,Math.abs(hi)*.07);const low=lo-pad,high=hi+pad;
 const xFor=(time,i)=>valid[0].time===valid.at(-1).time?l+i/(Math.max(1,pts.length-1))*plotW:l+(epoch(time)-epoch(valid[0].time))/(epoch(valid.at(-1).time)-epoch(valid[0].time))*plotW;
 const yFor=v=>t+(high-v)/(high-low)*plotH;
 const line=pts.map((p,i)=>(i?'L':'M')+xFor(p.time,i).toFixed(1)+' '+yFor(p.value).toFixed(1)).join(' ');const area=line+` L${xFor(pts.at(-1).time,pts.length-1).toFixed(1)} ${t+plotH} L${l} ${t+plotH} Z`;
 const id='g'+Math.random().toString(36).slice(2,9);const grid=[0,.25,.5,.75,1].map(k=>{const yy=t+plotH*k;return `<path d="M${l} ${yy} H${w-r}" stroke="#37515e" stroke-width=".8" stroke-dasharray="3 5"/><text x="${l-6}" y="${yy+3}" text-anchor="end">${nice(high-(high-low)*k,1)}</text>`}).join('');
 const labels=[valid[0],valid[Math.floor((valid.length-1)/2)],valid.at(-1)].map((p,i)=>`<text x="${l+plotW*(i/2)}" y="${h-8}" text-anchor="${['start','middle','end'][i]}">${stamp(p.time,cat==='peaks'?'date':'date')}</text>`).join('');
 return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="USGS ${esc(metricLabel(metric))} time series showing ${nice(lo)} to ${nice(hi)} ${esc(unit(metric.unit))}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#54dbc5" stop-opacity=".30"/><stop offset="1" stop-color="#54dbc5" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="#65e2cb" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>${pts.length===1?`<circle cx="${l}" cy="${yFor(pts[0].value)}" r="5" fill="#65e2cb"/>`:''}${labels}</svg><div class="chart-tooltip"><span>${nice(valid.length,0)} observations${limited?' · partial range':''}</span><span class="chart-hint">${cat==='peaks'?'Annual maximum values':'USGS measured observations'}</span></div><div class="stats3"><div><div class="label">Minimum</div><div class="num">${nice(lo,2)}</div></div><div><div class="label">Average*</div><div class="num">${nice(avg,2)}</div></div><div><div class="label">Maximum</div><div class="num">${nice(hi,2)}</div></div></div><div class="record-notice">*Arithmetic average of retrieved observations, not an official daily statistic. ${limited?'Result was truncated; reduce the date range for complete samples.':''}</div>`
}
function reloadSite(id){const site=sites.find(s=>s.id===id);if(!site)return;app.chartToken++;site.latest={continuous:[],daily:[]};site.metadata=[];site.errors={};site.requested=false;ensureSite(site,true);toast('Requesting updated USGS readings')}
function refreshEverything(){app.networkOK=false;app.dataError=false;for(const s of sites)if(!s.archive){s.latest={continuous:[],daily:[]};s.metadata=[];s.errors={};s.requested=false}render();Promise.all(sites.filter(s=>!s.archive).map(s=>ensureSite(s,true)));toast('Refreshing gauge network')}
async function discover(){// Modern USGS dynamic catalog search: only river-named stream stations with a time series.
 try{const q=`state_code = '51' AND site_type_code LIKE 'ST%' AND (monitoring_location_name LIKE '%NORTH ANNA RIVER%' OR monitoring_location_name LIKE '%N ANNA RIVER%')`;
 const j=await featurePage('monitoring-locations',{filter:q,'filter-lang':'cql2-text',limit:500});
 const found=j.features.map(f=>{const p=f.properties||{};let id=String(p.monitoring_location_number||p.id||f.id||'').replace(/^USGS-/,'');let pos=f.geometry?.coordinates||[];return {id,name:p.monitoring_location_name||'',short:shortName(p.monitoring_location_name||''),lat:Number(pos[1]),lon:Number(pos[0]),drainage:Number(p.drainage_area),archive:true}}).filter(s=>/^[0-9]{8,15}$/.test(s.id)&&/(?:NORTH|N)\s+ANNA\s+RIVER/i.test(s.name));
 for(const s of found){const old=sites.find(x=>x.id===s.id);if(old){old.name=s.name||old.name;old.lat=Number.isFinite(s.lat)?s.lat:old.lat;old.lon=Number.isFinite(s.lon)?s.lon:old.lon;if(s.drainage>0)old.drainage=s.drainage}}
 const extras=found.filter(s=>!sites.some(x=>x.id===s.id)).slice(0,25); // Validate candidates are true gauges, rather than one-time sampling locations.
 await Promise.all(extras.map(async s=>{try{let meta=await fetchMeta(s);if(meta.length){const end=Math.max(...meta.map(m=>epoch(m.seriesEnd)));s.archive=end<Date.now()-120*86400000;sites.push({...s,latest:{continuous:[],daily:[]},metadata:meta,extras:{},errors:{},requested:false})}}catch{}}));
 app.discovery='USGS station catalog checked';if(app.page==='home')renderHomeSummaryOnly();return
 }catch(e){console.info('OGC gauge discovery unavailable; trying legacy USGS station search',e.message)}
 try{let csv=[];for(const search of ['North Anna River','N Anna River']){const u=new URL('https://waterservices.usgs.gov/nwis/site/');Object.entries({format:'rdb',stateCd:'va',siteName:search,siteNameMatchOperator:'any',siteType:'ST',siteStatus:'all',hasDataTypeCd:'iv'}).forEach(([k,v])=>u.searchParams.set(k,v));const res=await fetch(u);if(!res.ok)continue;const body=await res.text();const lines=body.split(/\r?\n/).filter(x=>x&&!x.startsWith('#'));if(lines.length<3)continue;const heads=lines.shift().split('\t');lines.shift();csv.push(...lines.map(line=>{const cells=line.split('\t');return Object.fromEntries(heads.map((h,i)=>[h,cells[i]]))}))}
 for(let row of csv){const id=row.site_no;if(!/^[0-9]{8,15}$/.test(id)||sites.some(x=>x.id===id))continue;const lat=Number(row.dec_lat_va),lon=Number(row.dec_long_va);if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;sites.push({id,name:row.station_nm,short:shortName(row.station_nm),lat,lon,drainage:Number(row.drain_area_va)||0,archive:true,latest:{continuous:[],daily:[]},metadata:[],extras:{},errors:{},requested:false})}
 app.discovery='USGS legacy station catalog checked';if(app.page==='home')renderHomeSummaryOnly()
 }catch{app.discovery='Five verified gauge locations loaded · catalog refresh unavailable';if(app.page==='home')renderHomeSummaryOnly()}
}
function shortName(name){const x=name.toUpperCase();if(x.includes('MONROVIA'))return 'Monrovia';if(x.includes('PARTLOW'))return 'Partlow';if(x.includes('HART CORNER'))return 'Hart Corner';if(x.includes('LITTLE RIVER'))return 'Above Little River';if(x.includes('DOSWELL'))return 'Doswell';if(x.includes('HEWLETT'))return 'Hewlett';return name.replace(/NORTH ANNA RIVER|N ANNA RIVER/ig,'').replace(/,?\s*VA$/i,'').trim().replace(/\s+/g,' ').slice(0,40)||'North Anna'}
function begin(){const match=location.hash.match(/^#gauge-([0-9]+)$/);if(match){app.archived=true;openSite(match[1])}else if(location.hash==='#about')showAbout();else goHome('map');const mainSites=sites.filter(s=>!s.archive);Promise.all(mainSites.map(s=>ensureSite(s)));discover()}
window.addEventListener('online',()=>{toast('Back online · tap refresh for latest data')});window.addEventListener('offline',()=>toast('Offline · live data may not update'));
begin();
</script>
