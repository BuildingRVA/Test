const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=(n,d=2)=>n!==null&&n!==undefined&&n!==''&&Number.isFinite(Number(n))?Number(n).toLocaleString('en-US',{maximumFractionDigits:d}):'—';
const unit=s=>SHORTUNITS[s]||s||'';
const epoch=s=>{let n=Date.parse(s);return Number.isFinite(n)?n:0};
const ageHours=s=>epoch(s)?(Date.now()-epoch(s))/3600000:Infinity;
const stamp=(s,style='short')=>{if(!epoch(s))return 'No timestamp';try{let opts=style==='date'?{month:'short',day:'numeric',year:'numeric'}:style==='full'?{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}:{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'};return new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',...opts}).format(new Date(s))}catch{return s}};
const statusFor=s=>{if(s.archive)return {text:'Historical gauge',cls:'archived'};let recent=(s.latest.continuous||[]).filter(r=>r.code==='00060'||r.code==='00065');if(!recent.length)return {text:s.requested?'No recent reading':'Loading…',cls:'archived'};let a=Math.min(...recent.map(r=>ageHours(r.time)));return a<=24?{text:'Reporting',cls:''}:a<=72?{text:'Delayed',cls:'stale'}:{text:'Last reading old',cls:'stale'}};
function icon(name){const shapes={refresh:'<path d="M20 11a8 8 0 0 0-14-5L4 8V3M4 8h5M4 13a8 8 0 0 0 14 5l2-2v5m0-5h-5"/>',back:'<path d="m15 18-6-6 6-6"/>',wave:'<path d="M2 13c4 0 4-5 8-5s4 8 8 8 4-5 4-5"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${shapes[name]||shapes.wave}</svg>`}
let toastTimer;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3100)}
function navActive(which){['map','stations','about'].forEach(x=>document.getElementById('nav-'+x).classList.toggle('active',which===x))}
function gaugeSort(a,b){return (Number(a.drainage)||9999)-(Number(b.drainage)||9999)||b.lon-a.lon}
function selectedSites(){return sites.filter(s=>!s.archive).sort(gaugeSort)}
function miniReading(site,code){return [...(site.latest.continuous||[]),...(site.latest.daily||[])].filter(r=>r.code===code).sort((a,b)=>epoch(b.time)-epoch(a.time))[0]||null}
function fmtReading(m){if(!m)return '—';return `${nice(m.value,m.code==='00060'?1:2)} ${esc(unit(m.unit))}`}

function gaugeRow(site,i){const st=statusFor(site);const q=miniReading(site,'00060'),h=miniReading(site,'00065');return `<button class="gauge-row ${site.archive?'archived':''}" type="button" onclick="openSite('${site.id}')"><div class="gauge-row-main"><div class="gauge-number">${String(i+1).padStart(2,'0')}</div><div class="gauge-label">${esc(site.short)}<div class="gauge-desc">USGS ${esc(site.id)} &nbsp;·&nbsp; <span class="tag ${st.cls}">${esc(st.text)}</span></div></div><span class="row-chevron">›</span></div><div class="gauge-readings"><span><em>FLOW &nbsp;</em> ${fmtReading(q)}</span><span><em>STAGE &nbsp;</em> ${fmtReading(h)}</span></div></button>`}
function goHome(target='map'){app.view=target;app.page='home';app.detail=null;app.chartToken++;history.replaceState(null,'','#home');render();navActive(target==='stations'?'stations':'map');if(target==='stations')setTimeout(()=>document.getElementById('stations-anchor')?.scrollIntoView({behavior:'smooth',block:'start'}),90);else window.scrollTo(0,0)}

function readingCard(site,code,label){const r=miniReading(site,code);const cls=!r?'empty':'';const stale=r?ageHours(r.time)>24:true;return `<div class="reading ${cls}"><div class="label">${label}</div><div class="metric"><span>${r?nice(r.value,code==='00060'?1:2):'—'}</span><small>${r?esc(unit(r.unit)):''}</small></div><div class="reading-age">${r?`Measured ${stamp(r.time)} ET${stale?' · older reading':''}`:site.requested?'No current sensor reading available':'Fetching reading…'}</div></div>`}

<div class="station-hero"><div class="station-topline"><span class="tag ${st.cls}">● ${esc(st.text)}</span><span class="label">USGS ${esc(site.id)}</span></div><h1>${esc(site.short.replace(' · former station','').replace(' · former',''))}</h1><div class="station-location">${esc(site.name)}<br><a href="${SITE_URL(site.id)}" rel="noopener" target="_blank">Open official USGS station ↗</a></div></div>

function adjacent(direction){const shown=selectedSites();const i=shown.findIndex(s=>s.id===app.detail);if(shown[i+direction])openSite(shown[i+direction].id)}
function openSite(id){const site=sites.find(s=>s.id===id);if(!site)return;app.page='detail';app.detail=id;app.tab='daily';app.metricKey=null;app.period='30D';app.chart=[];app.chartToken++;history.replaceState(null,'','#gauge-'+id);navActive('stations');render();window.scrollTo(0,0);if(!app.snapshotOK&&!site.requested)loadSnapshot(true)}
function changeTab(t){app.tab=t;app.metricKey=null;app.chart=[];app.period=(t==='daily'?'30D':t==='continuous'?'7D':'ALL');app.chartToken++;const site=currentSite();if(site){renderMeasurementArea(site);if(t==='field'||t==='peaks')loadExtras(site,t)}}
function currentSite(){return sites.find(s=>s.id===app.detail)}
function metricLabel(m){if(m.name&&m.name.toLowerCase()!==m.code.toLowerCase()){
 const base=LABELS[m.code]||m.name;return base+(m.stat&&m.stat!=='00011'&&m.cat==='daily'?` · ${({'00001':'max','00002':'min','00003':'mean','00008':'median'})[m.stat]||m.stat}`:'')}
 return (LABELS[m.code]||`Parameter ${m.code}`)+(m.stat&&m.stat!=='00011'&&m.cat==='daily'?` · ${({'00001':'max','00002':'min','00003':'mean','00008':'median'})[m.stat]||m.stat}`:'')
}
function getMetricKey(m){return `${m.cat}:${m.id||m.code+':'+(m.stat||'')}`}
function normalFeature(f,cat){const p=f.properties||f;const id=p.time_series_id||p.timeseries_id||p.field_measurements_series_id||'';return {id:String(id),cat,code:String(p.parameter_code||''),stat:String(p.statistic_id||''),value:p.value===null||p.value===undefined||p.value===''?NaN:Number(p.value),time:p.time||null,unit:p.unit_of_measure||'',qualifier:p.qualifier||null,raw:p,name:LABELS[p.parameter_code]||p.parameter_name||'',seriesEnd:p.time||''}}
function usable(m){return m.code&&Number.isFinite(m.value)&&epoch(m.time)>0}
function metricsFor(site,cat){if(cat==='field'||cat==='peaks'){return Object.values((site.extras[cat]||{}).groups||{}).map(g=>g.metric).sort(metricSort)}
const base=site.latest[cat]||[];const met=site.metadata.filter(m=>m.cat===cat);const map=new Map();for(let m of met)map.set(getMetricKey(m),m);for(let m of base){const key=getMetricKey(m);const prior=map.get(key)||{};map.set(key,{...prior,...m,name:prior.name||m.name,begin:prior.begin||m.begin,seriesEnd:prior.seriesEnd||m.time})}return [...map.values()].sort(metricSort)}
function metricSort(a,b){const seq={'00060':0,'00065':1,'00062':2,'00010':3};return (seq[a.code]??9)-(seq[b.code]??9)||metricLabel(a).localeCompare(metricLabel(b))}
function measurementMarkup(site){const cat=app.tab;const arr=metricsFor(site,cat);const error=site.errors[cat];if(!arr.length){if((cat==='field'||cat==='peaks')&&!site.extras[cat]&&!error)return `<div class="loading"><i class="spinner"></i>Loading ${cat==='field'?'field measurements':'annual peak values'}…</div>`;if(!site.requested&&!error)return `<div class="loading"><i class="spinner"></i>Finding available parameters…</div>`;if(error)return `<div class="errorbox">${esc(error)} <button class="text-button" onclick="${cat==='field'||cat==='peaks'?`loadExtras(currentSite(),'${cat}',true)`:`reloadSite('${site.id}')`}">Try again →</button></div>`;return `<div class="data-empty"><div class="big-icon">⌁</div>No ${cat==='continuous'?'automated':cat==='daily'?'daily':cat==='field'?'field':'annual peak'} observations were returned by USGS for this location.<br><a href="${SITE_URL(site.id)}" target="_blank" rel="noopener">Browse its original record →</a></div>`}
let selected=arr.find(m=>getMetricKey(m)===app.metricKey);if(!selected){selected=arr[0];app.metricKey=getMetricKey(selected)}
let current=Number.isFinite(selected.value)?selected: null;let freshness=epoch(selected.time)?`Reading: ${stamp(selected.time,'full')}`:(epoch(selected.seriesEnd)?`Last in series: ${stamp(selected.seriesEnd,'date')}`:'History available');
return `<div class="metricstrip" role="group" aria-label="Select a measurement">${arr.map(m=>`<button class="metricpill ${getMetricKey(m)===app.metricKey?'active':''}" onclick="chooseMetric('${esc(getMetricKey(m))}')" title="USGS parameter ${esc(m.code)}">${esc(metricLabel(m))}<span class="code">${esc(m.code)}${m.stat&&m.stat!=='00011'?` · ${esc(m.stat)}`:''}</span></button>`).join('')}</div>
<div class="metric-banner"><div><span class="label">${esc(metricLabel(selected))}</span><div style="font-size:10px;color:#91aeb5;margin-top:6px">${esc(freshness)}</div></div><div class="value-block"><strong>${current?nice(current.value):'—'}</strong><br><small>${esc(unit(selected.unit))} ${selected.cat==='peaks'?'· annual peak':''}</small></div></div>
${cat==='continuous'||cat==='daily'?`<div class="periods" role="group" aria-label="History range">${(cat==='daily'?[['7D','7 days'],['30D','30 days'],['90D','90 days'],['1Y','1 year'],['LAST','Last record']]:[['1D','24h'],['7D','7 days'],['30D','30 days'],['90D','90 days'],['LAST','Last record']]).map(([k,n])=>`<button class="period ${app.period===k?'active':''}" onclick="setPeriod('${k}')">${n}</button>`).join('')}</div>`:''}
<div class="chart" id="chart-area">${cat==='field'||cat==='peaks'?renderExtraChart(site,selected):`<div class="loading"><i class="spinner"></i>Fetching actual USGS observations…</div>`}</div>
<div class="record-notice">${cat==='continuous'?'Automated sensor readings':cat==='daily'?'Daily values (may be means, minima or maxima)':cat==='field'?'Individual field measurements':'Annual peak observations'} · Parameter ${esc(selected.code)}. ${selected.begin?`Record begins ${stamp(selected.begin,'date')}.`:''} ${selected.seriesEnd?`Last recorded ${stamp(selected.seriesEnd,'date')}.`:''}</div>
${cat==='continuous'||cat==='daily'?`<a class="underlink" href="${esc(collectionURL(cat,{monitoring_location_id:'USGS-'+site.id,parameter_code:selected.code}))}" target="_blank" rel="noopener">View raw readings directly at USGS ↗</a>`:''}`}
function renderMeasurementArea(site){if(app.page!=='detail'||app.detail!==site.id)return;const tabs=document.getElementById('categorytabs');if(tabs)tabs.querySelectorAll('.pill').forEach((b,i)=>b.classList.toggle('selected',['continuous','daily','field','peaks'][i]===app.tab));const el=document.getElementById('measurements');if(el){el.innerHTML=measurementMarkup(site);if(app.tab==='continuous'||app.tab==='daily')requestChart(site)}}
function chooseMetric(key){app.metricKey=key;app.chart=[];app.chartToken++;renderMeasurementArea(currentSite())}
function setPeriod(p){app.period=p;app.chart=[];app.chartToken++;renderMeasurementArea(currentSite())}
function render(){if(app.page==='home'){main.innerHTML=homeMarkup();createMap()}else if(app.page==='detail'){const s=currentSite();if(s){main.innerHTML=siteMarkup(s);if(app.tab==='continuous'||app.tab==='daily')requestChart(s)}else{goHome()}}else{main.innerHTML=aboutMarkup()}}
function createMap(){
 const el=document.getElementById('river-map');if(!el)return;
 el.className='static-map';
 el.innerHTML='<img class="map-image" alt="North Anna River map background">';
 const img=el.querySelector('.map-image');
 img.src=MAP_BACKGROUND;
 img.alt='North Anna River map background';
 const note=document.createElement('div');note.className='map-disclaimer';note.textContent='Static background · tap a gauge pin';el.appendChild(note);
 for(const station of selectedSites()){
  const pos=PIN_POSITIONS[station.id];
  if(!pos)continue;
  const pin=document.createElement('button');pin.type='button';pin.className='pin';pin.style.left=pos.x+'%';pin.style.top=pos.y+'%';
  pin.setAttribute('aria-label','Open '+(pos.label||station.short)+' gauge');
  pin.innerHTML='<span class="pin-dot">●</span><span class="pin-name">'+esc(pos.label||station.short)+'</span>';
  pin.onclick=()=>openSite(station.id);el.appendChild(pin);
 }
}
function aboutMarkup(){return `<div class="screen"><header class="top"><div class="brand"><div class="brand-icon">${icon('wave')}</div><div><div class="eyebrow">RIVER WATCH</div><div class="brand-title">North Anna</div></div></div><button class="icon-btn" onclick="goHome('map')">${icon('back')}</button></header><div class="about"><div class="eyebrow">THE DATA BEHIND THE MAP</div><h1>Made for the river.</h1><div class="info-card"><h3>What this app shows</h3><p>The North Anna River’s USGS gauging stations, live and last-reported streamflow, gauge height and other parameters when measured, with selectable daily histories of available measurement types.</p><p>Stations are ordered upstream to downstream using the USGS-reported drainage area when available. Only the three active gauges—Monrovia, Partlow and Hart Corner—appear on the river map and gauge list.</p></div><div class="info-card"><h3>Where readings come from</h3><p>Measurements originate from the <a href="https://api.waterdata.usgs.gov/" target="_blank" rel="noopener">USGS Water Data APIs</a> and are refreshed by GitHub Actions every 30 minutes, then served from this website. No live readings are prefilled or simulated. The river map background image is embedded in this HTML, with three fixed gauge pins for Monrovia, Partlow and Hart Corner; no map service or map key is needed.</p><p><a target="_blank" rel="noopener" href="https://api.waterdata.usgs.gov/docs/ogcapi/">USGS API documentation ↗</a></p></div><div class="info-card"><h3>Understanding the numbers</h3><p><strong>Streamflow (cfs)</strong> measures the volume of water passing a gauge per second. <strong>Gauge height (ft)</strong> is elevation above the gauge’s local reference point; it is not the water’s depth across the river.</p><p>Different gauges measure different parameters. An older reading is labeled rather than presented as current. Measurements may be provisional, delayed, adjusted or missing.</p></div><div class="info-card"><h3>Data coverage and safety</h3><p>This app shows currently operating USGS North Anna River gauges with automated or daily time series. It does not include private dam sensors, separate tributary and lake gauges, or the full laboratory water-quality sample archive. Measurements vary by station; sensor-only types are summarized by day when possible.</p><p>For flooding and other urgent conditions consult <a href="https://water.noaa.gov/" rel="noopener" target="_blank">NOAA Water Prediction</a> and local official warnings. This is not a navigation or flood-warning system.</p></div><div class="info-card"><h3>Using it on iPhone</h3><p>Open this HTML in Safari from an HTTPS website (for example, GitHub Pages). Choose Share → Add to Home Screen. A web connection is needed for updated USGS measurements; the static river map image is built in. Data updates require the included GitHub Actions workflow and Python script. Local file previews in the Files app may block internet requests, so web hosting is recommended.</p></div></div></div>`}
/* --- Networking: USGS OGC API v1, v0 failover, and legacy IV backup --- */
async function fetchJSON(url,timeoutMs=18000){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),timeoutMs);try{const response=await fetch(url,{signal:ctrl.signal,headers:{Accept:'application/geo+json,application/json;q=0.9'}});if(!response.ok)throw Error(`HTTP ${response.status}${response.status===429?' (USGS request limit)':''}`);const js=await response.json();if(!js||!Array.isArray(js.features))throw Error('Unexpected USGS response');app.networkOK=true;return js}finally{clearTimeout(timer)}}
function collectionURL(kind,params={},base=BASE){const u=new URL(`${base}/${kind}/items`);u.searchParams.set('f','json');for(const [k,v] of Object.entries(params))if(v!==null&&v!==undefined)u.searchParams.set(k,String(v));return u.toString()}
async function featurePage(kind,params={}){let err;for(const base of [BASE,BASE0]){try{return await fetchJSON(collectionURL(kind,params,base))}catch(e){err=e}}throw err}
async function features(kind,params={},maxPages=2){let result=[],url=collectionURL(kind,{limit:5000,...params}),page=0,limited=false;
 while(url&&page<maxPages){let js;try{js=page===0?await featurePage(kind,{limit:5000,...params}):await fetchJSON(url)}catch(e){if(page===0)throw e;limited=true;break}
 result.push(...js.features);page++;let next=(js.links||[]).find(l=>l.rel==='next'&&l.href);url=next?.href||'';
 if(page>=maxPages&&url)limited=true;if(result.length>20000){limited=true;break}}
 return {data:result,limited}
}
async function latestFor(site,cat){try{const json=await featurePage(cat==='continuous'?'latest-continuous':'latest-daily',{monitoring_location_id:'USGS-'+site.id,limit:1000});return json.features.map(f=>normalFeature(f,cat)).filter(usable)}catch(e){if(cat==='continuous'){try{return await legacyInstant(site.id)}catch{}}throw e}}
async function legacyInstant(id){const url=new URL('https://waterservices.usgs.gov/nwis/iv/');url.searchParams.set('format','json');url.searchParams.set('sites',id);url.searchParams.set('period','P7D');const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),17000);
 try{const res=await fetch(url,{signal:ctrl.signal});if(!res.ok)throw Error('Legacy data unavailable');const j=await res.json();app.networkOK=true;return (j.value?.timeSeries||[]).map(ts=>{let latest=ts.values?.flatMap(x=>x.value||[]).filter(v=>Number.isFinite(Number(v.value))).at(-1);const p=ts.variable||{};return latest?{id:String(ts.name||p.variableCode?.[0]?.value||''),cat:'continuous',code:p.variableCode?.[0]?.value||'',stat:'00011',value:Number(latest.value),time:latest.dateTime,unit:p.unit?.unitCode||'',name:p.variableName||'',qualifier:latest.qualifiers}:null}).filter(Boolean)}finally{clearTimeout(timer)}}
async function fetchMeta(site){const json=await featurePage('time-series-metadata',{monitoring_location_id:'USGS-'+site.id,limit:2000});return json.features.map(f=>{const p=f.properties||{};const stat=String(p.statistic_id||'');const period=String(p.computation_period_identifier||'').toLowerCase();const comp=String(p.computation_identifier||'').toLowerCase();const cat=period.includes('instant')||comp.includes('instant')||stat==='00011'?'continuous':'daily';return {id:String(p.timeseries_id||p.time_series_id||''),cat,code:String(p.parameter_code||''),stat,value:NaN,time:null,unit:p.unit_of_measure||'',name:p.parameter_name||p.parameter_description||'',begin:p.begin_utc||p.begin||'',seriesEnd:p.end_utc||p.end||'',webDescription:p.web_description||''}}).filter(m=>m.code)}
async function ensureSite(site,force=false){if(site.requested&&!force)return;site.requested=true;site.errors.continuous='';site.errors.daily='';if(app.page==='detail'&&app.detail===site.id)render();const jobs=[['continuous',latestFor(site,'continuous')],['daily',latestFor(site,'daily')],['metadata',fetchMeta(site)]];
 await Promise.all(jobs.map(async([key,p])=>{try{const v=await p;if(key==='metadata')site.metadata=v;else site.latest[key]=v;delete site.errors[key]}catch(e){site.errors[key]=`Unable to connect to USGS ${key} data. ${e.message||''}`}
 if(app.page==='detail'&&app.detail===site.id){const scroll=window.scrollY;const c=document.getElementById('measurements');if(c){const s=document.querySelector('.station-hero .tag');if(s){let st=statusFor(site);s.textContent='● '+st.text;s.className='tag '+st.cls}document.querySelector('.detail-readings').innerHTML=readingCard(site,'00060','Streamflow')+readingCard(site,'00065','Gauge height');renderMeasurementArea(site)}else render();window.scrollTo(0,scroll)}else if(app.page==='home'){renderHomeSummaryOnly()}}
 ));app.dataError=!app.networkOK; if(app.page==='home')renderHomeSummaryOnly()}
function renderHomeSummaryOnly(){
 if(app.page!=='home')return;
 const shown=selectedSites();
 const cards=document.querySelectorAll('.summary .big');
 if(cards[0])cards[0].textContent=sites.filter(s=>!s.archive).length;
 if(cards[1])cards[1].innerHTML=sites.filter(s=>!s.archive&&ageHours(miniReading(s,'00060')?.time)<24).length+' <span style="font-size:14px;color:#a6bfc4;font-weight:500">/ '+sites.filter(s=>!s.archive).length+'</span>';
 const list=document.querySelector('.gauge-list');if(list)list.innerHTML=shown.map((s,i)=>gaugeRow(s,i)).join('');
 const status=document.getElementById('network-status');if(status)status.textContent=app.networkOK?(app.snapshotOK?'USGS data updated '+stamp(app.snapshotGenerated,'full')+' · automatic updates':'USGS data connection successful · readings on request'):app.dataError?'USGS request failed · check gauge details':'Connecting to USGS…';
 const pulse=document.querySelector('.status-pulse');if(pulse)pulse.className='status-pulse '+(app.networkOK?'good':app.dataError?'warn':'');
 const legend=document.querySelector('.legend');if(legend)legend.textContent=app.discovery+' · Active gauges only.';
}
async function loadExtras(site,cat,force=false){if(!site)return;if(site.extras[cat]&&!force)return;if(site.extras[cat]&&force)delete site.extras[cat];site.errors[cat]='';if(app.tab===cat)renderMeasurementArea(site);
 try{const endpoint=cat==='field'?'field-measurements':'peaks';const r=await features(endpoint,{monitoring_location_id:'USGS-'+site.id},4);
 let groups={};for(const f of r.data){const m=normalFeature(f,cat);if(!usable(m))continue;const k=m.code+(cat==='field'?':'+String(m.raw.reading_type||''):'');if(!groups[k])groups[k]={metric:m,points:[]};groups[k].points.push(m);if(epoch(m.time)>epoch(groups[k].metric.time))groups[k].metric=m}
 for(const g of Object.values(groups))g.points.sort((a,b)=>epoch(a.time)-epoch(b.time));site.extras[cat]={groups,limited:r.limited};
 }catch(e){site.errors[cat]=`Could not retrieve ${cat==='field'?'field measurements':'annual peak records'} from USGS. ${e.message||''}`}
 if(app.page==='detail'&&app.detail===site.id&&app.tab===cat)renderMeasurementArea(site)
}
function renderExtraChart(site,selected){const cat=app.tab;const extra=site.extras[cat];const group=extra?.groups?.[selected.code+(cat==='field'?':'+String(selected.raw?.reading_type||''):'')];if(!group||!group.points.length)return `<div class="data-empty">No numeric observations for this parameter.</div>`;return chartSVG(group.points,selected,extra.limited,cat)}

async function legacyHistory(siteId,code,cat,period,lastTime){
 const u=new URL('https://waterservices.usgs.gov/nwis/'+(cat==='daily'?'dv':'iv')+'/');
 u.searchParams.set('format','json');u.searchParams.set('sites',siteId);u.searchParams.set('parameterCd',code);
 const days={'1D':1,'7D':7,'30D':30,'90D':90,'1Y':365}[period]||30;
 if(period==='LAST'&&lastTime){let end=new Date(lastTime);if(!Number.isNaN(end.getTime())){u.searchParams.set('startDT',new Date(end.getTime()-days*86400000).toISOString().slice(0,10));u.searchParams.set('endDT',end.toISOString().slice(0,10))}else u.searchParams.set('period','P'+days+'D')}
 else u.searchParams.set('period','P'+days+'D');
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{const r=await fetch(u,{signal:controller.signal});if(!r.ok)throw Error('USGS history HTTP '+r.status);const j=await r.json();const out=[];
 for(const ts of j.value?.timeSeries||[]){const variable=ts.variable||{};for(const block of ts.values||[])for(const v of block.value||[]){const n=Number(v.value);if(!Number.isFinite(n)||!v.dateTime)continue;out.push({code,cat,value:n,time:v.dateTime,unit:variable.unit?.unitCode||'',name:variable.variableName||'',stat:ts.variable?.options?.option?.[0]?.value||''})}}
 return out.sort((a,b)=>epoch(a.time)-epoch(b.time));
 }finally{clearTimeout(timer)}
}

async function requestChart(site){if(!site||app.page!=='detail'||app.detail!==site.id||!(app.tab==='continuous'||app.tab==='daily'))return;
 const cat=app.tab;const metric=metricsFor(site,cat).find(m=>getMetricKey(m)===app.metricKey);if(!metric)return;
 const token=++app.chartToken;const interval={'1D':'P1D','7D':'P7D','30D':'P30D','90D':'P90D','1Y':'P1Y'}[app.period];let datetime=interval ? new Date(Date.now()-({'1D':1,'7D':7,'30D':30,'90D':90,'1Y':365}[app.period])*86400000).toISOString()+'/'+new Date().toISOString() : undefined;
 if(app.period==='LAST'){const end=metric.time||metric.seriesEnd;const endMs=epoch(end);if(endMs){const days=cat==='daily'?365:30;const startMs=endMs-days*86400000;datetime=new Date(startMs).toISOString()+'/'+new Date(endMs+86400000).toISOString()}else datetime='P30D'}
 const params={monitoring_location_id:'USGS-'+site.id,parameter_code:metric.code};if(metric.stat&&cat==='daily')params.statistic_id=metric.stat;if(datetime)params.datetime=datetime;
 try{let r=await features(cat,params,cat==='continuous'?4:2);if(token!==app.chartToken||app.page!=='detail'||site.id!==app.detail)return;
 const points=r.data.map(f=>normalFeature(f,cat)).filter(m=>usable(m)&&m.code===metric.code&&(!metric.stat||!m.stat||m.stat===metric.stat)).sort((a,b)=>epoch(a.time)-epoch(b.time));app.chart=points;
 if(!points.length){try{const backup=await legacyHistory(site.id,metric.code,cat,app.period,metric.time||metric.seriesEnd);if(token!==app.chartToken)return;points.push(...backup)}catch(e){console.warn('Historical fallback',e)}}
 const el=document.getElementById('chart-area');if(!el)return;el.innerHTML=points.length?chartSVG(points,metric,r.limited,cat):`<div class="data-empty">No measurements returned for <strong>${app.period==='LAST'?'the last recorded window':esc(app.period)}</strong>.<br>${app.period!=='LAST'&&epoch(metric.seriesEnd)?`This series last reported ${stamp(metric.seriesEnd,'date')}.<br><button class="text-button" onclick="setPeriod('LAST')">Show last recorded data →</button>`:'Try another time range or consult USGS.'}</div>`;

function attachChartScrubber(container,raw,metric){
 const svg=container.querySelector('svg');if(!svg)return;
 const line=svg.querySelector('#scrub-line'),dot=svg.querySelector('#scrub-dot'),readout=container.querySelector('#scrub-readout');
 const data=raw.filter(p=>Number.isFinite(Number(p.value))&&epoch(p.time)).sort((a,b)=>epoch(a.time)-epoch(b.time));
 if(!data.length||!line||!dot||!readout)return;
 const left=38,right=345,top=14,bottom=192;
 const first=epoch(data[0].time),last=epoch(data[data.length-1].time);
 const vv=data.map(p=>Number(p.value)),min=Math.min(...vv),max=Math.max(...vv);
 const padding=(max-min)*.13||Math.max(.25,Math.abs(max)*.07),low=min-padding,high=max+padding;
 svg.classList.add('scrubbable-chart');
 const draw=e=>{
  const rect=svg.getBoundingClientRect();if(!rect.width)return;
  const x=Math.min(right,Math.max(left,(e.clientX-rect.left)/rect.width*355));
  const target=first+(x-left)/(right-left)*(last-first);
  let lo=0,hi=data.length;
  while(lo<hi){const mid=(lo+hi)>>>1;if(epoch(data[mid].time)<target)lo=mid+1;else hi=mid}
  const index=lo===0?0:lo===data.length?data.length-1:(Math.abs(epoch(data[lo].time)-target)<Math.abs(epoch(data[lo-1].time)-target)?lo:lo-1);
  const p=data[index],px=last===first?left:left+(epoch(p.time)-first)/(last-first)*(right-left);
  const py=top+(high-Number(p.value))/(high-low)*(bottom-top);
  line.setAttribute('x1',px);line.setAttribute('x2',px);line.setAttribute('opacity','0.75');
  dot.setAttribute('cx',px);dot.setAttribute('cy',py);dot.setAttribute('opacity','1');
  readout.textContent=stamp(p.time,'date')+'  ·  '+nice(p.value,1)+' '+unit(metric.unit);
  readout.classList.add('active');
 };
 svg.addEventListener('pointerdown',e=>{if(e.cancelable)e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch{}draw(e)});
 svg.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&e.buttons===0 || e.pointerType==='touch'&&e.isPrimary || e.buttons)draw(e)});
 svg.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')draw(e)});
 // The last selected reading remains shown when a finger lifts.
}

   s.cachedDaily=Array.isArray(saved.daily)?saved.daily:[];
   s.latest.daily=s.cachedDaily.map(({points,...m})=>({...m,cat:'daily'}));
   s.latest.continuous=(saved.continuous||[]).map(({points,...m})=>({...m,cat:'continuous'}));
   s.metadata=[];s.errors={};s.requested=true;s.loading=false;
   if(s.cachedDaily.length||s.latest.continuous.length)available++;
  }
  if(!available)throw Error('No usable gauge observations in the data file');
  app.snapshotOK=true;app.snapshotGenerated=snap.generated_at||null;
  app.networkOK=true;app.dataError=false;
  if(app.page==='detail'){
   const station=currentSite();
   if(station){const cards=document.querySelector('.detail-readings');if(cards)cards.innerHTML=readingCard(station,'00060','Streamflow')+readingCard(station,'00065','Gauge height');renderMeasurementArea(station);
   const tag=document.querySelector('.station-hero .tag');if(tag){const st=statusFor(station);tag.textContent='● '+st.text;tag.className='tag '+st.cls;}}
  }else if(app.page==='home')renderHomeSummaryOnly();
  return true;
 }catch(err){if(showError){
  for(const s of sites){if(!s.cachedDaily?.length&&!s.latest.daily.length){s.requested=true;s.loading=false;s.errors.daily='No published USGS data file found ('+err.message+'). Install and run the included GitHub Actions workflow once, then refresh this page.';}}
  if(app.page==='detail')renderMeasurementArea(currentSite());else if(app.page==='home')renderHomeSummaryOnly();
 }return false;}
}
function begin(){
 const match=location.hash.match(/^#gauge-([0-9]+)$/);
 if(match&&sites.some(s=>s.id===match[1]&&!s.archive))openSite(match[1]);
 else if(location.hash==='#about')showAbout();else goHome('map');
 loadSnapshot(true);
}
window.addEventListener('online',()=>{toast('Back online · tap refresh for latest data')});window.addEventListener('offline',()=>toast('Offline · live data may not update'));
begin();
</script>
